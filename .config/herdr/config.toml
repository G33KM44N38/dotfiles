onboarding = false
# herdr configuration
# Mirrors the tmux muscle memory from ~/.config/tmux/tmux.conf plus Herdr defaults.
# After a Herdr upgrade: ~/.dotfiles/bin/test-herdr-regressions

[terminal]
new_cwd = "follow"

# Keep every Herdr-created checkout inside its bare repository directory:
# <directory>/<bare-repo-name>/<branch-slug>.
[worktrees]
directory = "/Users/boss/coding/work"

[keys]
prefix = "ctrl+a"

# tmux-style tab/window controls
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"
last_pane = "prefix+semicolon"

# tmux/vi pane controls
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
focus_pane_left = ["prefix+h", "alt+shift+h"]
focus_pane_down = ["prefix+j", "alt+shift+j"]
focus_pane_up = ["prefix+k", "alt+shift+k"]
focus_pane_right = ["prefix+l", "alt+shift+l"]
swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# Keep Herdr's useful defaults reachable.
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+shift+r"
open_notification_target = ""
focus_agent = "prefix+alt+1..9"
workspace_picker = "prefix+w"
goto = ["prefix+g", "shift+alt+g"]
new_workspace = "prefix+shift+n"
new_worktree = "ctrl+shift+w"
open_worktree = ""
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+q"
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"

# Workspace picker navigation (after prefix+w). Keep arrows and add vi keys.
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]

# Custom tmux-style equalize. Uses public `herdr pane resize`, not layout.apply.
# after_split_pane = "equalize_panes"

[[keys.command]]
key = "prefix+="
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-equalize-panes"

[[keys.command]]
key = "cmd+k"
type = "pane"
command = "$HOME/.dotfiles/bin/herdr-navigate"

[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-navigate \"$HOME/Library/Mobile Documents/iCloud~md~obsidian/Documents/Second_Brain/\""

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-navigate \"$HOME/coding/work/babacoiffure_monorepo.git/\""

[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-navigate \"$HOME/coding/work/database/\""

[[keys.command]]
key = "prefix+shift+d"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-navigate \"$HOME/.dotfiles/\""

[[keys.command]]
key = "alt+q"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-worktree-root"

[[keys.command]]
key = "alt+e"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-worktree-main"

[[keys.command]]
key = "alt+r"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-worktree-release"

[[keys.command]]
key = "cmd+o"
type = "pane"
command = "$HOME/.dotfiles/bin/herdr-worktree-picker"

[[keys.command]]
key = "cmd+p"
type = "pane"
command = "$HOME/.dotfiles/bin/herdr-worktree-picker --threads"

[[keys.command]]
key = "cmd+alt+p"
type = "pane"
command = "$HOME/.dotfiles/bin/herdr-worktree-picker --new-thread"

[[keys.command]]
key = "alt+h"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-tab editor"

[[keys.command]]
key = "alt+j"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-tab agent"

[[keys.command]]
key = "alt+k"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-tab process"

[[keys.command]]
key = "alt+l"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-tab terminal"

[[keys.command]]
key = "alt+semicolon"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-tab diff"

[[keys.command]]
key = "alt+1"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-pane 1"

[[keys.command]]
key = "alt+2"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-pane 2"

[[keys.command]]
key = "alt+3"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-pane 3"

[[keys.command]]
key = "alt+4"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-pane 4"

[[keys.command]]
key = "alt+5"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-pane 5"

[[keys.command]]
key = "alt+6"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-pane 6"

[[keys.command]]
key = "alt+7"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-pane 7"

[[keys.command]]
key = "alt+8"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-pane 8"

[[keys.command]]
key = "alt+9"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-pane 9"

[[keys.command]]
key = "ctrl+shift+n"
type = "popup"
command = "$HOME/.dotfiles/bin/herdr-start-codex"
description = "start Codex on Mac or Ubuntu"
width = 56
height = 12

[[keys.command]]
key = "alt+g"
type = "pane"
command = "$HOME/.dotfiles/bin/herdr-git.sh open-web"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-status blocked"

[[keys.command]]
key = "prefix+i"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-status idle"

[[keys.command]]
key = "prefix+d"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-status done"

[[keys.command]]
key = "prefix+o"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-agent-status working"

[experimental]
pane_history = true

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "off"

[theme]
name = "catppuccin"
auto_switch = false
