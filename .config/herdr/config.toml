onboarding = false
# herdr configuration
# Mirrors the tmux muscle memory from ~/.config/tmux/tmux.conf plus Herdr defaults.

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# tmux-style tab/window controls
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"
last_pane = "prefix+semicolon"

# tmux/vi pane controls
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# Keep Herdr's useful defaults reachable.
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+shift+r"
open_notification_target = ""
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
new_worktree = "ctrl+shift+w"
open_worktree = ""
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+q"
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"

# Custom tmux-style equalize. Uses public `herdr pane resize`, not layout.apply.
# after_split_pane = "equalize_panes"

[[keys.command]]
key = "prefix+="
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-equalize-panes"

[[keys.command]]
key = "ctrl+f"
type = "pane"
command = "$HOME/.dotfiles/bin/herdr-thread-picker.sh --workspaces"

[[keys.command]]
key = "alt+t"
type = "pane"
command = "env TMUX_THREAD_ATTENTION_ONLY=1 $HOME/.dotfiles/bin/herdr-thread-picker.sh"

[[keys.command]]
key = "alt+shift+t"
type = "pane"
command = "env TMUX_THREAD_ATTENTION_ONLY=0 $HOME/.dotfiles/bin/herdr-thread-picker.sh"

[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-navigate \"$HOME/Library/Mobile Documents/iCloud~md~obsidian/Documents/Second_Brain/\""

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-navigate \"$HOME/coding/work/babacoiffure_monorepo.git/\""

[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-navigate \"$HOME/coding/work/database/\""

[[keys.command]]
key = "prefix+shift+d"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-navigate \"$HOME/.dotfiles/\""

[[keys.command]]
key = "alt+q"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-worktree-root"

[[keys.command]]
key = "alt+e"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-worktree-main"

[[keys.command]]
key = "alt+r"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-worktree-release"

[[keys.command]]
key = "alt+o"
type = "pane"
command = "$HOME/.dotfiles/bin/herdr-worktree-picker"

[[keys.command]]
key = "alt+h"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-tab editor"

[[keys.command]]
key = "alt+j"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-tab agent"

[[keys.command]]
key = "alt+k"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-tab process"

[[keys.command]]
key = "alt+l"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-focus-tab terminal"

[[keys.command]]
key = "ctrl+shift+n"
type = "shell"
command = "$HOME/.dotfiles/bin/herdr-start-pi"

[[keys.command]]
key = "alt+g"
type = "pane"
command = "$HOME/.dotfiles/bin/herdr-git.sh menu"

[experimental]
pane_history = true

[ui.toast]
delivery = "off"

[theme]
name = "catppuccin"
auto_switch = false
