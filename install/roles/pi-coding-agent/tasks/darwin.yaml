---
- name: Install pi-coding-agent
  homebrew:
    name: pi-coding-agent
    state: present
    update_homebrew: yes

- name: Create Pi extensions directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/extensions"
    state: directory
    mode: "0755"

- name: Install Herdr Pi integration
  ansible.builtin.command: herdr integration install pi
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/extensions/herdr-agent-state.ts"

- name: Install Pi thinking arrow shortcuts
  ansible.builtin.copy:
    src: thinking-arrow-shortcuts.ts
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/extensions/thinking-arrow-shortcuts.ts"
    mode: "0644"

- name: Install Pi fast mode shortcut
  ansible.builtin.copy:
    src: fast-mode-shortcut.ts
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/extensions/fast-mode-shortcut.ts"
    mode: "0644"

- name: Install Pi Linear branch status extension
  ansible.builtin.copy:
    src: linear-branch-status.ts
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/extensions/linear-branch-status.ts"
    mode: "0644"

- name: Install Pi custom status footer extension
  ansible.builtin.copy:
    src: pi-status-footer.ts
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/extensions/pi-status-footer.ts"
    mode: "0644"

- name: Install Pi dollar skill shortcut extension
  ansible.builtin.copy:
    src: skill-dollar-shortcut.ts
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/extensions/skill-dollar-shortcut.ts"
    mode: "0644"

- name: Install Pi steer-on-escape extension
  ansible.builtin.copy:
    src: steer-on-escape.ts
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/extensions/steer-on-escape.ts"
    mode: "0644"

- name: Install Pi Codex-style subagents extension
  ansible.builtin.copy:
    src: pi-codex-subagents.ts
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/extensions/pi-codex-subagents.ts"
    mode: "0644"

- name: Install Pi keybindings
  ansible.builtin.copy:
    src: keybindings.json
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/keybindings.json"
    mode: "0644"

- name: Remove legacy Tintinweb Pi subagents package
  ansible.builtin.shell: |
    set -o pipefail
    if pi list | grep -q 'npm:@tintinweb/pi-subagents'; then
      pi remove npm:@tintinweb/pi-subagents
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Install Pi markdown code block UI patcher
  ansible.builtin.copy:
    src: patch-markdown-code-blocks.js
    dest: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/patch-markdown-code-blocks.js"
    mode: "0755"

- name: Patch Pi markdown code block UI
  ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.pi/agent/patch-markdown-code-blocks.js"
  changed_when: "'patched ' in pi_markdown_patch.stdout"
  register: pi_markdown_patch
