---
- name: HERDR | Require a supported architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['x86_64', 'aarch64']
    fail_msg: "Herdr supports x86_64 and aarch64 on Linux."

- name: HERDR | Read latest release metadata
  ansible.builtin.uri:
    url: https://api.github.com/repos/herdrdev/herdr/releases/latest
    return_content: true
  register: herdr_release

- name: HERDR | Select Linux release asset
  ansible.builtin.set_fact:
    herdr_asset: >-
      {{ herdr_release.json.assets
         | selectattr(
             'name',
             'equalto',
             'herdr-linux-' +
             ('x86_64' if ansible_architecture == 'x86_64' else 'aarch64')
           )
         | first }}

- name: HERDR | Install executable
  ansible.builtin.get_url:
    url: "{{ herdr_asset.browser_download_url }}"
    dest: "{{ ansible_env.HOME }}/.local/bin/herdr"
    checksum: "{{ herdr_asset.digest }}"
    mode: "0755"

- name: HERDR | Create config directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/herdr"
    state: directory
    mode: "0755"

- name: HERDR | Install Linux-adapted shared config
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.config/herdr/config.toml"
    mode: "0644"
    content: >-
      {{ lookup('ansible.builtin.file', herdr_config_source)
         | replace('/Users/boss', ansible_env.HOME)
         | replace('coding/work', 'code')
         | replace(mac_second_brain, 'Documents/Second_Brain') }}
  vars:
    herdr_config_source: >-
      {{ playbook_dir }}/../.config/herdr/config.toml
    mac_second_brain: >-
      Library/Mobile Documents/iCloud~md~obsidian/Documents/Second_Brain

- name: HERDR | Install current Codex integration
  ansible.builtin.command: >-
    {{ ansible_env.HOME }}/.local/bin/herdr integration install codex
  register: herdr_codex_integration
  changed_when: >-
    'installed' in herdr_codex_integration.stdout | lower

- name: HERDR | Read linger state
  ansible.builtin.command: >-
    loginctl show-user {{ ansible_user_id }} --property=Linger --value
  register: herdr_linger_state
  changed_when: false

- name: HERDR | Enable user services after logout
  ansible.builtin.command: loginctl enable-linger {{ ansible_user_id }}
  become: true
  when: herdr_linger_state.stdout | trim != 'yes'

- name: HERDR | Create systemd user directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user"
    state: directory
    mode: "0755"

- name: HERDR | Install persistent user service
  ansible.builtin.copy:
    src: herdr.service
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/herdr.service"
    mode: "0644"
  register: herdr_user_service

- name: HERDR | Reload systemd user units
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  when: herdr_user_service.changed

- name: HERDR | Enable persistent user service
  ansible.builtin.systemd_service:
    name: herdr.service
    enabled: true
    scope: user

- name: HERDR | Check current server
  ansible.builtin.command: >-
    {{ ansible_env.HOME }}/.local/bin/herdr status server
  register: herdr_server_status
  changed_when: false
  failed_when: false

- name: HERDR | Start persistent user service
  ansible.builtin.systemd_service:
    name: herdr.service
    state: started
    scope: user
  when: herdr_server_status.rc != 0
