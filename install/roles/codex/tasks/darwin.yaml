---
  - name: Configure Codex home for macOS apps
    ansible.builtin.import_tasks: environment.yaml

  - name: Install latest Codex globally
    npm:
      name: "@openai/codex"
      global: yes
      state: latest

  - name: Remove invalid codex-code-mode-host shim
    ansible.builtin.file:
      path: /opt/homebrew/bin/codex-code-mode-host
      state: absent

  - name: Remove legacy codex-auth package
    npm:
      name: codex-auth
      global: yes
      state: absent

  - name: Install Loongphy codex-auth globally
    npm:
      name: "@loongphy/codex-auth"
      global: yes
      state: latest

  - name: Enable codex-auth auto-switch
    ansible.builtin.command: codex-auth config auto enable
    changed_when: false

  - name: Disable codex-auth API refresh
    ansible.builtin.command: codex-auth config api disable
    changed_when: false
